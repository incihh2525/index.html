
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mənimlə əlaqəni kəsmək istəyirsən?</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background:
      linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.7)),
      url("https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=1600");
    background-size: cover;
    background-position: center;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 400px;
    padding: 35px 20px;
    text-align: center;
    background: rgba(0, 35, 90, 0.88);
    border: 3px solid #ffdf00;
    border-radius: 25px;
    color: white;
    box-shadow: 0 0 30px #ffdf00;
}

h1 {
    color: #ffdf00;
    font-size: 27px;
}

p {
    font-size: 18px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 35px;
    min-height: 55px;
}

button {
    padding: 14px 30px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#yes {
    background: #ffdf00;
    color: #001b55;
}

#no {
    background: white;
    color: #001b55;
}

#message {
    display: none;
    color: #ffdf00;
    font-size: 23px;
    margin-top: 25px;
}

.logo {
    font-size: 45px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">💛💙</div>


    <p id="question">
        Mənimlə əlaqəni kəsmək istəyirsən? 🥺
    </p>

    <div class="buttons" id="buttons">
        <button id="yes" onclick="yesClick()">HƏ ❤️</button>
        <button id="no" onclick="noClick()">YOX 😒</button>
    </div>

    <div id="message">
        Bilirdim ki, məni tək qoymazsan! ❤️🥹
        <br><br>
        Səni çox istəyirəm! 💛💙
    </div>
</div>

<script>
let count = 0;

function noClick() {
    count++;

    const no = document.getElementById("no");

    no.style.position = "fixed";

    const maxX = window.innerWidth - no.offsetWidth - 20;
    const maxY = window.innerHeight - no.offsetHeight - 20;

    no.style.left = Math.max(10, Math.random() * maxX) + "px";
    no.style.top = Math.max(10, Math.random() * maxY) + "px";

    document.getElementById("question").innerText =
        count >= 3
        ? "YOX demək olmur 😂 Bir də fikirləş! ❤️"
        : "Əminsən? Bir də düşün 🥺";
}

function yesClick() {
    document.getElementById("question").innerText =
        "Düzgün seçim etdin! 😍";

    document.getElementById("buttons").style.display = "none";

    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
